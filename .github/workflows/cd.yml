name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [ "main" ]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: cd-deploy
  cancel-in-progress: true

jobs:

  changes:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.filter.outputs.app_changed }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Détecter si l'image doit être reconstruite
        id: filter
        run: |
          if git diff --quiet HEAD^1 HEAD -- app Dockerfile requirements.txt; then
            echo "Aucun fichier impactant l'image, on saute le build."
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            sampaniony/quiz-master:${{ github.event.workflow_run.head_sha }}
            sampaniony/quiz-master:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in Helm values
        run: |
          set -euo pipefail

          NEW_SHA=${{ github.event.workflow_run.head_sha }}
          VALUES_FILE=quiz-master/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          CURRENT_SHA=$(yq '.image.tag' "$VALUES_FILE")

          if [ -n "$CURRENT_SHA" ] && [ "$CURRENT_SHA" != "null" ] && git cat-file -e "$CURRENT_SHA" 2>/dev/null; then
            if ! git merge-base --is-ancestor "$CURRENT_SHA" "$NEW_SHA"; then
              echo "Le SHA entrant ($NEW_SHA) n'est pas un descendant du tag actuellement déployé ($CURRENT_SHA) : on saute la mise à jour pour éviter une régression."
              exit 0
            fi
          fi

          yq -i ".image.tag = \"$NEW_SHA\"" "$VALUES_FILE"

          if git diff --quiet -- "$VALUES_FILE"; then
            echo "Tag déjà à jour, rien à committer."
            exit 0
          fi

          git add "$VALUES_FILE"
          git commit -m "chore(cd): bump image tag to $NEW_SHA [skip ci]"
          git push origin main
